<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>아버지의 드라이브 - Hyundai UserStory</title>
  <meta name="description" content="아버지의 운전 경험을 따라가는 Hyundai UserStory 플레이북">
  <meta property="og:type" content="website">
  <meta property="og:title" content="아버지의 드라이브 - Hyundai UserStory">
  <meta property="og:description" content="아버지의 운전 경험을 따라가는 Hyundai UserStory 플레이북">
  <meta property="og:url" content="https://hyundai-user-story-16px.vercel.app/">
  <meta property="og:image" content="https://hyundai-user-story-16px.vercel.app/Asset/Thumbnail/T_Thumbnail.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://hyundai-user-story-16px.vercel.app/Asset/Thumbnail/T_Thumbnail.png">
  <link rel="stylesheet" href="style.css?v=20260805-scenario-ui-r1">
</head>
<body>
  <svg class="visual-filters" aria-hidden="true">
    <filter id="film-turbulence">
      <feTurbulence type="fractalNoise" baseFrequency=".008" numOctaves="2" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="24"/>
    </filter>
  </svg>

  <header class="top-header">
    <button id="rewindBtn" class="icon-btn" type="button" aria-label="플레이북 처음으로 돌아가기">
      <img src="Asset/Playbook/_Story/UI/T_Back.png" alt="" draggable="false">
    </button>
    <div class="header-center">
      <h1 class="title-pill">아버지의 운전은 계속되어야 하니까</h1>
      <div class="sub-metrics" aria-label="콘텐츠 반응">
        <span class="metric">조회수 2.8천회</span>
        <span class="metric">댓글 38개</span>
        <span class="metric">공유 800회</span>
      </div>
    </div>
    <div class="header-right">
      <button class="icon-btn" type="button" aria-label="조회">
        <img src="Asset/Playbook/_Story/UI/T_Eye.png" alt="" draggable="false">
      </button>
      <button class="icon-btn" type="button" aria-label="공유">
        <img src="Asset/Playbook/_Story/UI/T_Download.png" alt="" draggable="false">
      </button>
    </div>
  </header>

  <main>
    <section id="sq01" class="sequence--intro" aria-label="인트로">
      <div id="vhsCassette" class="vhs-stage-wrapper">
        <div class="film-strip-background">
          <img class="film-strip-img" src="Asset/Playbook/_Screen/T_VideoFilm.png" alt="" draggable="false">
        </div>
        <div class="vhs-cassette-frame">
          <img class="vhs-body-img" src="Asset/Playbook/_Screen/T_Video.png" alt="VHS 플레이어" draggable="false">
          <div class="vhs-screen-window">
            <div id="frame1" class="story-frame active"><img class="screen-content-img" src="Asset/Playbook/_Story/Cover/T_Concern_01.png" alt="운전을 고민하는 아버지"></div>
            <div id="frame2" class="story-frame"><img class="screen-content-img" src="Asset/Playbook/_Story/Cover/T_Concern_02.png" alt="운전을 고민하는 아버지"></div>
            <div id="frame3" class="story-frame"><img class="screen-content-img" src="Asset/Playbook/_Story/01_Accident/T_Accident_01.png" alt="도로 위 아버지"></div>
          </div>
          <div class="vhs-label-title">익숙했던 운전이 <span>조금씩 어려워질 때</span></div>
          <p id="noteText" class="vhs-orange-note">일정은 똑같은데, 대중교통은 힘들고...<br>어쩔 수 없지만 운전은 해야겠어.</p>
          <div id="glitchOverlay" class="glitch-overlay" aria-hidden="true"></div>
        </div>
      </div>
      <button id="scrollPrompt" class="scroll-prompt" type="button">
        <span class="scroll-text">스크롤해서 이야기를 확인해 보세요</span>
        <span class="scroll-arrow" aria-hidden="true">⌄</span>
      </button>
    </section>

    <section id="filmStory" class="film-story scroll-sequences" aria-label="운전 시나리오">
      <div class="film-story-stage">
        <div class="shared-film-viewport">
          <div class="shared-film">
            <img class="shared-film-mask" src="Asset/Playbook/_Screen/T_Film.png" alt="" draggable="false">
            <span class="film-date film-date--2">2026. 03. 23 (MON)</span>
            <span class="film-date film-date--3">2026. 03. 24 (TUE)</span>
            <span class="film-date film-date--4">2026. 03. 25 (WED)</span>
            <span class="film-date film-date--5">2026. 03. 26 (THU)</span>
            <span class="film-date film-date--6">2026. 03. 27 (FRI)</span>
            <span class="film-date film-date--7">2026. 03. 29 (SUN)</span>
            <div class="film-window" data-sequence="2">
              <img src="Asset/Playbook/_Story/01_Accident/T_Accident_01.png" alt="사고 상황 1"><img src="Asset/Playbook/_Story/01_Accident/T_Accident_02.png" alt="사고 상황 2"><img src="Asset/Playbook/_Story/01_Accident/T_Accident_03.png" alt="사고 상황 3">
            </div>
            <div class="film-window" data-sequence="3">
              <img src="Asset/Playbook/_Story/02_Parking/T_Parking_01.png" alt="주차 상황 1"><img src="Asset/Playbook/_Story/02_Parking/T_Parking_02.png" alt="주차 상황 2"><img src="Asset/Playbook/_Story/02_Parking/T_Parking_03.png" alt="주차 상황 3">
            </div>
            <div class="film-window" data-sequence="4">
              <img src="Asset/Playbook/_Story/03_NewFeatures/T_Technology_01.png" alt="신기술 사용 1"><img src="Asset/Playbook/_Story/03_NewFeatures/T_Technology_02.png" alt="신기술 사용 2"><img src="Asset/Playbook/_Story/03_NewFeatures/T_Technology_03.png" alt="신기술 사용 3">
            </div>
            <div class="film-window" data-sequence="5">
              <img src="Asset/Playbook/_Story/04_PhoneCall/T_PhoneCall_01.png" alt="가족 통화 1"><img src="Asset/Playbook/_Story/04_PhoneCall/T_PhoneCall_02.png" alt="가족 통화 2"><img src="Asset/Playbook/_Story/04_PhoneCall/T_PhoneCall_03.png" alt="가족 통화 3">
            </div>
            <div class="film-window" data-sequence="6">
              <img src="Asset/Playbook/_Story/05_PublicTransit/T_PublicTransit_01.png" alt="대중교통 이동 1"><img src="Asset/Playbook/_Story/05_PublicTransit/T_PublicTransit_02.png" alt="대중교통 이동 2"><img src="Asset/Playbook/_Story/05_PublicTransit/T_PublicTransit_03.png" alt="대중교통 이동 3">
            </div>
            <div class="film-window" data-sequence="7">
              <img src="Asset/Playbook/_Story/06_Schedule/T_Schedule_01.png" alt="일정 관리 1"><img src="Asset/Playbook/_Story/06_Schedule/T_Schedule_02.png" alt="일정 관리 2"><img src="Asset/Playbook/_Story/06_Schedule/T_Schedule_03.png" alt="일정 관리 3">
            </div>
          </div>
          <div class="film-outfocus film-outfocus--top"></div>
          <div class="film-outfocus film-outfocus--bottom"></div>
        </div>
        <div class="sequence-copy">
          <p class="sequence-kicker">DRIVING STORY</p>
          <h2 class="sequence-title">예상하지 못한 순간에도<br><span class="title-highlight">안전하게</span></h2>
        </div>
        <p class="sequence-bubble">익숙한 길에서도 사고는 갑자기 찾아옵니다.</p>
      </div>
      <div class="film-story-timeline">
        <div id="sq02" class="sequence-segment" data-sequence="2" data-steps="3" data-title="예상하지 못한 순간에도|안전하게" data-highlight="안전하게" data-bubbles="익숙한 길에서도 사고는 갑자기 찾아옵니다.|반응이 조금 늦어지는 순간이 걱정됩니다.|위험을 먼저 알아채 주는 차가 필요합니다."><i></i><i></i><i></i></div>
        <div class="sequence-segment" data-sequence="3" data-steps="3" data-title="좁은 공간에서도|부담 없이" data-highlight="부담 없이" data-bubbles="주차할 때 주변을 한 번 더 확인합니다.|고개를 돌리는 일이 예전보다 어렵습니다.|차가 주변을 함께 살펴주면 좋겠습니다."><i></i><i></i><i></i></div>
        <div class="sequence-segment" data-sequence="4" data-steps="3" data-title="새로운 기능은|쉽고 직관적으로" data-highlight="쉽고 직관적으로" data-bubbles="기능이 많아도 쓰기 어려우면 소용없습니다.|자주 쓰는 기능은 한눈에 보여야 합니다.|필요한 순간 바로 이해되는 기술이면 좋겠습니다."><i></i><i></i><i></i></div>
        <div class="sequence-segment" data-sequence="5" data-steps="3" data-title="가족과 연결되는|안심의 순간" data-highlight="안심의 순간" data-bubbles="아빠, 지금 어디예요?\n천천히 오셔도 돼요.\n조심해서 오세요.|운전 중에는 통화도 간단해야 합니다.|가족에게 이동 상황이 자연스럽게 전해집니다."><i></i><i></i><i></i></div>
        <div class="sequence-segment" data-sequence="6" data-steps="3" data-title="이동의 선택지를|더 편안하게" data-highlight="더 편안하게" data-bubbles="대중교통만으로는 일상을 지키기 어렵습니다.|짐이 있거나 환승이 많으면 더 힘듭니다.|내가 원하는 시간에 움직일 자유가 필요합니다."><i></i><i></i><i></i></div>
        <div class="sequence-segment" data-sequence="7" data-steps="3" data-title="매일의 일정을|오래도록 이어가도록" data-highlight="오래도록 이어가도록" data-bubbles="병원과 약속은 계속 이어집니다.|운전은 단순한 이동보다 큰 의미입니다.|안전하게 오래 운전할 수 있는 방법을 찾습니다."><i></i><i></i><i></i></div>
        <div class="game-transition-spacer"></div>
      </div>
    </section>

    <section id="sq08" class="game-sequence" aria-label="반응 속도 게임">
      <iframe class="game-frame" src="Asset/Playbook/_Game/Game.html" title="야간 주행 반응 속도 체험"></iframe>
    </section>
  </main>

  <button id="gameSkipButton" class="game-skip-button" type="button">SCENARIO</button>
  <div class="bottom-gradient" aria-hidden="true"></div>

  <section id="scenarioCanvas" class="scenario-canvas-stage" aria-label="시나리오 캔버스" aria-hidden="true">
    <div class="canvas-track" id="scenarioTrack">
      <div class="canvas-slide"><img src="Asset/ScenarioCanvas/3_ScenarioCanvas_01.jpg" alt="시나리오 캔버스 1"></div>
      <div class="canvas-slide"><img src="Asset/ScenarioCanvas/3_ScenarioCanvas_02.jpg" alt="시나리오 캔버스 2"></div>
      <div class="canvas-slide"><img src="Asset/ScenarioCanvas/3_ScenarioCanvas_03.jpg" alt="시나리오 캔버스 3"></div>
      <div class="canvas-slide"><img src="Asset/ScenarioCanvas/3_ScenarioCanvas_04.jpg" alt="시나리오 캔버스 4"></div>
      <div class="canvas-slide"><img src="Asset/ScenarioCanvas/3_ScenarioCanvas_05.jpg" alt="시나리오 캔버스 5"></div>
    </div>
    <div class="canvas-pagination" id="scenarioIndicator">
      <div class="pagination-dots">
        <button class="p-dot active" type="button" data-index="0" aria-label="1페이지"></button><button class="p-dot" type="button" data-index="1" aria-label="2페이지"></button><button class="p-dot" type="button" data-index="2" aria-label="3페이지"></button><button class="p-dot" type="button" data-index="3" aria-label="4페이지"></button><button class="p-dot" type="button" data-index="4" aria-label="5페이지"></button>
      </div>
      <span id="scenarioCounter" class="pagination-text">01 / 05</span>
    </div>
  </section>

  <script type="module" src="app.js?v=20260805-scenario-ui-r1"></script>
</body>
</html>
