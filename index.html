<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>핸들을 놓기엔, 내 인생은 아직 주행 중</title>
  <meta name="description" content="고령 운전자의 시선으로 바라본 일상과 교통 현실. 스크롤 인터랙션 비디오 테이프 스토리텔링">
  <meta property="og:type" content="website">
  <meta property="og:title" content="고령 운전자의 하루 — Scroll Sequence">
  <meta property="og:description" content="고령 운전자의 시선으로 바라본 일상과 교통 현실. 스크롤 인터랙션 비디오 테이프 스토리텔링">
  <meta property="og:url" content="https://hyundai-user-story-16px.vercel.app/">
  <meta property="og:image" content="https://hyundai-user-story-16px.vercel.app/Asset/Thumbnail/T_Thumbnail.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://hyundai-user-story-16px.vercel.app/Asset/Thumbnail/T_Thumbnail.png">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <svg class="visual-filters" aria-hidden="true">
    <filter id="film-turbulence">
      <feTurbulence type="fractalNoise" baseFrequency=".008" numOctaves="2" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="24"/>
    </filter>
  </svg>

  <main>
    <section id="cover" class="page-section sequence--intro" aria-label="인트로">
      <div id="vhsCassette" class="vhs-stage-wrapper">
        <div class="film-strip-background">
          <img class="film-strip-img" src="Asset/Playbook/_Screen/T_VideoFilm.png" alt="" draggable="false">
        </div>
        <div class="vhs-cassette-frame">
          <img class="vhs-body-img" src="Asset/Playbook/_Screen/T_Video.png" alt="VHS 플레이어" draggable="false">
          <div class="vhs-screen-window">
            <div id="frame1" class="story-frame active"><img class="screen-content-img" src="Asset/Playbook/_Story/Cover/T_Concern_02.png" alt="운전을 고민하는 아버지"></div>
            <div id="frame2" class="story-frame"><img class="screen-content-img" src="Asset/Playbook/_Story/Cover/T_Concern_02.png" alt="운전을 고민하는 아버지"></div>
            <div id="frame3" class="story-frame"><img class="screen-content-img" src="Asset/Playbook/_Story/Cover/T_Concern_02.png" alt="운전을 고민하는 아버지"></div>
          </div>
          <div class="vhs-label-title">고령 운전자의 하루, <span>원점으로</span> 돌아오다.</div>
          <p id="noteText" class="vhs-orange-note">일정은 똑같은데, 대중교통은 힘들고...<br>어쩔 수 없지만 운전은 해야겠어.</p>
          <div id="glitchOverlay" class="glitch-overlay" aria-hidden="true"></div>
        </div>
      </div>
      <button id="scrollPrompt" class="scroll-prompt" type="button">
        <span class="scroll-text">스크롤해서 이야기를 확인해 보세요</span>
        <span class="scroll-arrow" aria-hidden="true">⌄</span>
      </button>
    </section>

    <section id="playbook" class="page-section film-story scroll-sequences" aria-label="운전 시나리오">
      <h1 class="sr-only">핸들을 놓기엔, 내 인생은 아직 주행 중</h1>
      <div class="film-story-stage">
        <div class="shared-film-viewport">
          <div class="shared-film">
            <img class="shared-film-mask" src="Asset/Playbook/_Screen/T_Film.png" alt="" draggable="false">
            <span class="film-date film-date--2">2026. 03. 23 (MON)</span>
            <span class="film-date film-date--3">2026. 03. 24 (TUE)</span>
            <span class="film-date film-date--4">2026. 03. 25 (WED)</span>
            <span class="film-date film-date--5">2026. 03. 26 (THU)</span>
            <span class="film-date film-date--6">2026. 03. 27 (FRI)</span>
            <span class="film-date film-date--7">2026. 03. 29 (SUN)</span>
            <div class="film-window" data-sequence="2">
              <img class="is-active" src="Asset/Playbook/_Story/01_Accident/T_Accident_01.png" alt="사고 상황 1"><img src="Asset/Playbook/_Story/01_Accident/T_Accident_02.png" alt="사고 상황 2"><img src="Asset/Playbook/_Story/01_Accident/T_Accident_03.png" alt="사고 상황 3">
            </div>
            <div class="film-window" data-sequence="3">
              <img class="is-active" src="Asset/Playbook/_Story/02_Parking/T_Parking_01.png" alt="주차 상황 1"><img src="Asset/Playbook/_Story/02_Parking/T_Parking_02.png" alt="주차 상황 2">
            </div>
            <div class="film-window" data-sequence="4">
              <img class="is-active" src="Asset/Playbook/_Story/03_NewFeatures/T_Technology_01.png" alt="신기술 사용 1"><img src="Asset/Playbook/_Story/03_NewFeatures/T_Technology_02.png" alt="신기술 사용 2">
            </div>
            <div class="film-window" data-sequence="5">
              <img class="is-active" src="Asset/Playbook/_Story/04_PhoneCall/T_PhoneCall_02.png" alt="가족 통화 2"><img src="Asset/Playbook/_Story/04_PhoneCall/T_PhoneCall_03.png" alt="가족 통화 3">
            </div>
            <div class="film-window" data-sequence="6">
              <img class="is-active" src="Asset/Playbook/_Story/05_PublicTransit/T_PublicTransit_01.png" alt="대중교통 이동 1"><img src="Asset/Playbook/_Story/05_PublicTransit/T_PublicTransit_02.png" alt="대중교통 이동 2"><img src="Asset/Playbook/_Story/05_PublicTransit/T_PublicTransit_03.png" alt="대중교통 이동 3">
            </div>
            <div class="film-window" data-sequence="7">
              <img class="is-active" src="Asset/Playbook/_Story/06_Schedule/T_Schedule_02.png" alt="일정 관리 2">
            </div>
          </div>
          <div class="film-outfocus film-outfocus--top"></div>
          <div class="film-outfocus film-outfocus--bottom"></div>
        </div>
        <div class="sequence-copy">
          <p class="sequence-kicker">DRIVING STORY</p>
          <h2 class="sequence-title">이제는<br><span class="title-highlight">예전 같지 않은 반사 신경</span>으로 불안이 커진다</h2>
        </div>
        <p class="sequence-bubble">내 운전 경력이 얼만데! 아직 문제 없어!</p>
      </div>
      <div class="film-story-timeline">
        <div id="sq02" class="sequence-segment" data-sequence="2" data-steps="3" data-title="이제는|예전 같지 않은 반사 신경으로 불안이 커진다" data-highlight="예전 같지 않은 반사 신경" data-bubbles="내 운전 경력이 얼만데! 아직 문제 없어!|어이구, 깜짝이야! 갑자기 오토바이가 나타났네!|이제는 반사 신경이 예전 같지 않네..."><i></i><i></i><i></i></div>
        <div class="sequence-segment" data-sequence="3" data-steps="2" data-title="차량 조작에 있어서|공간, 거리 판단의 어려움 증가" data-highlight="공간, 거리 판단의 어려움 증가" data-bubbles="어휴, 공간이 잘 안 나오네...|예전에는 한 번에 주차했는데... 이제는 백미러를 몇 번이나 보게 되네..."><i></i><i></i></div>
        <div class="sequence-segment" data-sequence="4" data-steps="2" data-title="새로운 기능과 어려운 용어로 기술 습득에 부담" data-highlight="기술 습득에 부담" data-bubbles="딸이 요즘 좋은 기능이 있다고 하던데...|모르는 기능이 너무 많고 복잡한데...\n이걸 어떻게 쓰지?"><i></i><i></i></div>
        <div class="sequence-segment" data-sequence="5" data-steps="2" data-title="운전을 말리는 주변인들의 걱정과 염려" data-highlight="주변인들의 걱정과 염려" data-bubbles="아빠... 이제는 나이도 있으니 운전을 그만하면 안 돼?\n나 걱정돼서 그래...|이제는 자녀들도 내 운전을 걱정하네...\n진짜 이제 운전을 그만해야 하나..."><i></i><i></i></div>
        <div class="sequence-segment" data-sequence="6" data-steps="3" data-title="운전대를 놓으며|멀어진 일상의 주도권" data-highlight="멀어진 일상의 주도권" data-bubbles="자식도 그렇게 말하는데... 대중교통을 탈까?|먼 거리도 아닌데 환승이 몇 번이야?|운전을 그만두니 이동이 버겁네..."><i></i><i></i><i></i></div>
        <div class="sequence-segment" data-sequence="7" data-steps="1" data-title="내 삶을 되찾기 위한 운전의 재선택" data-highlight="운전의 재선택" data-bubbles="그래도 운전은 포기할 수 없어!"><i></i></div>
        <div class="game-transition-spacer"></div>
      </div>
    </section>

    <div id="sq08" class="game-sequence" role="region" aria-label="반응 속도 게임">
      <iframe class="game-frame" src="Asset/Playbook/_Game/Game.html?v=20260805-small-wheel-r1" title="야간 주행 반응 속도 체험"></iframe>
    </div>

    <section id="scenario-canvas" class="page-section scenario-canvas-stage" aria-label="시나리오 캔버스">
      <div class="canvas-track" id="scenario-canvas-track">
        <div class="canvas-slide"><img src="Asset/ScenarioCanvas/3_ScenarioCanvas_01.jpg" alt="시나리오 캔버스 1"></div>
        <div class="canvas-slide"><img src="Asset/ScenarioCanvas/3_ScenarioCanvas_02.jpg" alt="시나리오 캔버스 2"></div>
        <div class="canvas-slide"><img src="Asset/ScenarioCanvas/3_ScenarioCanvas_03.jpg" alt="시나리오 캔버스 3"></div>
        <div class="canvas-slide"><img src="Asset/ScenarioCanvas/3_ScenarioCanvas_04.jpg" alt="시나리오 캔버스 4"></div>
        <div class="canvas-slide"><img src="Asset/ScenarioCanvas/3_ScenarioCanvas_05.jpg" alt="시나리오 캔버스 5"></div>
      </div>
      <div class="canvas-pagination" id="scenario-indicator">
        <div class="pagination-dots">
          <button class="p-dot active" type="button" data-index="0" aria-label="1페이지"></button>
          <button class="p-dot" type="button" data-index="1" aria-label="2페이지"></button>
          <button class="p-dot" type="button" data-index="2" aria-label="3페이지"></button>
          <button class="p-dot" type="button" data-index="3" aria-label="4페이지"></button>
          <button class="p-dot" type="button" data-index="4" aria-label="5페이지"></button>
        </div>
        <span id="scenario-counter" class="pagination-text">01 / 05</span>
      </div>
    </section>
  </main>

  <button id="gameSkipButton" class="game-skip-button" type="button">게임 건너뛰기</button>
  <div class="bottom-gradient" aria-hidden="true"></div>

  <script type="module" src="assets/app.js"></script>
</body>
</html>
